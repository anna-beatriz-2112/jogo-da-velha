<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha em Python</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            padding: 20px;
        }

        .container {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 16px 0;
        }

        .mode-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #0284c7, #8b5cf6);
            color: white;
            border-color: transparent;
            font-weight: 600;
        }

        .scoreboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 18px 0;
            background: rgba(15, 23, 42, 0.6);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .score-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .score-title {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .score-value {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .score-x { color: #38bdf8; }
        .score-o { color: #f43f5e; }
        .score-ties { color: #fbbf24; }

        .status {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 14px 0 20px;
            min-height: 28px;
            color: #cbd5e1;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .cell {
            aspect-ratio: 1;
            background: rgba(15, 23, 42, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .cell:hover:not(.taken) {
            background: rgba(51, 65, 85, 0.6);
            border-color: rgba(56, 189, 248, 0.4);
            transform: scale(1.02);
        }

        .cell.x {
            color: #38bdf8;
            text-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
        }

        .cell.o {
            color: #f43f5e;
            text-shadow: 0 0 16px rgba(244, 63, 94, 0.5);
        }

        .cell.win {
            background: rgba(34, 197, 94, 0.2);
            border-color: #22c55e;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.04); }
        }

        .btn-restart {
            background: linear-gradient(135deg, #0284c7, #8b5cf6);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        footer {
            margin-top: 16px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Jogo da Velha 🎮</h1>

        <div class="mode-selector">
            <button class="mode-btn active" id="modePvp" onclick="setMode('pvp')">2 Jogadores</button>
            <button class="mode-btn" id="modeCpu" onclick="setMode('cpu')">Contra Robô 🤖</button>
        </div>

        <div class="scoreboard">
            <div class="score-item">
                <span class="score-title">Jogador X</span>
                <span class="score-value score-x" id="scoreX">0</span>
            </div>
            <div class="score-item">
                <span class="score-title">Empates</span>
                <span class="score-value score-ties" id="scoreTies">0</span>
            </div>
            <div class="score-item">
                <span class="score-title" id="playerOLabel">Jogador O</span>
                <span class="score-value score-o" id="scoreO">0</span>
            </div>
        </div>

        <div class="status" id="status">Vez do Jogador <span style="color:#38bdf8">X</span></div>

        <div class="board" id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>

        <button class="btn-restart" onclick="restartGame()">Reiniciar Partida</button>

        <footer>
            Rodando em Python: <code>C:\playground\jogodavelha</code>
        </footer>
    </div>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isGameActive = true;
        let mode = "pvp"; // 'pvp' ou 'cpu'
        let scores = { X: 0, O: 0, ties: 0 };

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Linhas
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Colunas
            [0, 4, 8], [2, 4, 6]             // Diagonais
        ];

        const cells = document.querySelectorAll('.cell');
        const statusEl = document.getElementById('status');

        function setMode(newMode) {
            mode = newMode;
            document.getElementById('modePvp').classList.toggle('active', mode === 'pvp');
            document.getElementById('modeCpu').classList.toggle('active', mode === 'cpu');
            document.getElementById('playerOLabel').innerText = mode === 'cpu' ? 'Robô (O)' : 'Jogador O';
            restartGame();
        }

        function makeMove(index) {
            if (board[index] !== "" || !isGameActive) return;

            executeMove(index, currentPlayer);

            if (isGameActive && mode === 'cpu' && currentPlayer === 'O') {
                setTimeout(cpuMove, 300);
            }
        }

        function executeMove(index, player) {
            board[index] = player;
            cells[index].innerText = player;
            cells[index].classList.add('taken', player.toLowerCase());

            checkResult();
        }

        function cpuMove() {
            if (!isGameActive) return;

            // 1. Tentar vencer
            let move = findWinningMove('O');
            // 2. Bloquear vitória do jogador X
            if (move === null) move = findWinningMove('X');
            // 3. Pegar o centro se disponível
            if (move === null && board[4] === "") move = 4;
            // 4. Jogada aleatória entre as disponíveis
            if (move === null) {
                const available = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
                if (available.length > 0) {
                    move = available[Math.floor(Math.random() * available.length)];
                }
            }

            if (move !== null) {
                executeMove(move, 'O');
            }
        }

        function findWinningMove(player) {
            for (let condition of winningConditions) {
                const [a, b, c] = condition;
                const vals = [board[a], board[b], board[c]];
                if (vals.filter(v => v === player).length === 2 && vals.includes("")) {
                    if (board[a] === "") return a;
                    if (board[b] === "") return b;
                    if (board[c] === "") return c;
                }
            }
            return null;
        }

        function checkResult() {
            let roundWon = false;
            let winningCombo = null;

            for (let condition of winningConditions) {
                const [a, b, c] = condition;
                if (board[a] !== "" && board[a] === board[b] && board[a] === board[c]) {
                    roundWon = true;
                    winningCombo = condition;
                    break;
                }
            }

            if (roundWon) {
                winningCombo.forEach(idx => cells[idx].classList.add('win'));
                statusEl.innerHTML = `🎉 Vitória do <span style="color:${currentPlayer === 'X' ? '#38bdf8' : '#f43f5e'}">${currentPlayer}</span>!`;
                scores[currentPlayer]++;
                updateScoreboard();
                isGameActive = false;
                return;
            }

            if (!board.includes("")) {
                statusEl.innerHTML = `🤝 Partida terminou em <span style="color:#fbbf24">Empate</span>!`;
                scores.ties++;
                updateScoreboard();
                isGameActive = false;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            statusEl.innerHTML = `Vez do ${mode === 'cpu' && currentPlayer === 'O' ? 'Robô' : 'Jogador'} <span style="color:${currentPlayer === 'X' ? '#38bdf8' : '#f43f5e'}">${currentPlayer}</span>`;
        }

        function updateScoreboard() {
            document.getElementById('scoreX').innerText = scores.X;
            document.getElementById('scoreO').innerText = scores.O;
            document.getElementById('scoreTies').innerText = scores.ties;
        }

        function restartGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            isGameActive = true;
            statusEl.innerHTML = `Vez do Jogador <span style="color:#38bdf8">X</span>`;
            cells.forEach(cell => {
                cell.innerText = "";
                cell.className = "cell";
            });
        }
    </script>
</body>
</html>
